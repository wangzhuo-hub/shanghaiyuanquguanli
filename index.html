<!-- 所有依赖通过 npm + Vite 构建，不使用 CDN importmap -->
<script>
// 清理旧的 AI 配置数据，迁移到 sessionStorage
(function() {
  try {
    const aiConfigKey = 'ai_config';
    // 从 localStorage 迁移旧配置到 sessionStorage
    const savedConfig = localStorage.getItem(aiConfigKey);
    if (savedConfig) {
      const config = JSON.parse(savedConfig);
      // 删除敏感字段
      if (config.geminiApiKey !== undefined) {
        delete config.geminiApiKey;
        if (config.provider === 'gemini') {
          config.provider = 'qwen';
        }
      }
      // 迁移到 sessionStorage（更安全：关闭标签页自动清除）
      sessionStorage.setItem(aiConfigKey, JSON.stringify(config));
      // 清除 localStorage 中的旧配置
      localStorage.removeItem(aiConfigKey);
      console.log('AI 配置已迁移到 sessionStorage');
    }
  } catch (e) {
    console.error('AI 配置清理失败:', e);
    localStorage.removeItem('ai_config');
  }
})();
</script>
<link rel="stylesheet" href="/index.css">
<script>
// 全局错误捕获（仅记录，不破坏 DOM）
 window.addEventListener('error', function(e) {
   console.error('全局错误:', e.error || e.message, e.filename, e.lineno);
 });

 window.addEventListener('unhandledrejection', function(e) {
   console.error('未处理的 Promise 拒绝:', e.reason);
 });
</script>
