<script>
// 清理旧的 AI 配置数据，移除 geminiApiKey 字段
(function() {
  try {
    const aiConfigKey = 'ai_config';
    const savedConfig = localStorage.getItem(aiConfigKey);
    if (savedConfig) {
      const config = JSON.parse(savedConfig);
      // 如果包含 geminiApiKey，删除它
      if (config.geminiApiKey !== undefined) {
        delete config.geminiApiKey;
        // 如果 provider 是 gemini，改为 qwen
        if (config.provider === 'gemini') {
          config.provider = 'qwen';
        }
        localStorage.setItem(aiConfigKey, JSON.stringify(config));
        console.log('AI 配置已更新，移除 Gemini 相关设置');
      }
    }
  } catch (e) {
    console.error('AI 配置清理失败:', e);
    // 如果清理失败，删除整个配置
    localStorage.removeItem('ai_config');
  }
})();
</script>
<link rel="stylesheet" href="/index.css">
<script>
// 全局错误捕获
 window.addEventListener('error', function(e) {
   console.error('全局错误:', e.error || e.message);
   document.body.innerHTML = '<div style="padding: 20px; font-family: monospace;">' +
     '<h1 style="color: red;">加载错误</h1>' +
     '<p><strong>错误信息:</strong> ' + (e.message || '未知错误') + '</p>' +
     '<p><strong>文件:</strong> ' + (e.filename || '未知') + '</p>' +
     '<p><strong>行号:</strong> ' + (e.lineno || '未知') + '</p>' +
     '<p style="margin-top: 20px;">请按 F12 打开控制台查看详细错误</p>' +
     '</div>';
 });
 
 window.addEventListener('unhandledrejection', function(e) {
   console.error('未处理的 Promise 拒绝:', e.reason);
 });
</script>
